<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FZ EARN Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0b1220; color: #f8fafc; padding: 16px; min-height: 100vh; }
    .card { background: #131f35; border: 1px solid #1e3154; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand { font-size: 20px; font-weight: 800; color: #fbbf24; }
    .uid { font-size: 12px; color: #94a3b8; background: #1e293b; padding: 4px 10px; border-radius: 999px; }
    .balance-box { background: linear-gradient(135deg, #065f46, #047857); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .balance-label { font-size: 13px; color: #a7f3d0; margin-bottom: 6px; }
    .balance-val { font-size: 34px; font-weight: 800; color: #ffffff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .btn { border: none; border-radius: 14px; padding: 16px 12px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .btn-bonus { background: #2563eb; }
    .btn-ads { background: #7c3aed; }
    .btn-ref { background: #0891b2; }
    .btn-wd { background: #d97706; }
    .toast { background: #1e293b; border-left: 4px solid #fbbf24; padding: 12px; border-radius: 10px; font-size: 14px; color: #e2e8f0; display: none; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">⚡ FZ EARN</div>
    <div class="uid" id="userBadge">Loading...</div>
  </div>
  <div class="balance-box">
    <div class="balance-label">আপনার বর্তমান ব্যালেন্স</div>
    <div class="balance-val"><span id="bal">0</span> পয়েন্ট</div>
  </div>
  <div class="grid">
    <button class="btn btn-bonus" onclick="claimBonus()"><span>🎁</span><span>Daily Bonus</span></button>
    <button class="btn btn-ads" onclick="watchAd()"><span>📺</span><span>Watch Ads</span></button>
    <button class="btn btn-ref" onclick="showRef()"><span>👥</span><span>Referral</span></button>
    <button class="btn btn-wd" onclick="openWithdraw()"><span>💳</span><span>Withdraw</span></button>
  </div>
  <div class="card">
    <div style="font-weight:700; margin-bottom:6px;">📌 নিয়মাবলি</div>
    <div style="font-size:13px; color:#94a3b8; line-height:1.5;">
      • প্রতিদিন ফ্রি বোনাস: +১০ পয়েন্ট<br>
      • প্রতি রেফার: +২০ পয়েন্ট<br>
      • সর্বনিম্ন Withdraw: ৩০০ পয়েন্ট ও ১০টি রেফার
    </div>
    <div class="toast" id="msgBox"></div>
  </div>
  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : { first_name: "Guest", id: "Demo" };
    document.getElementById("userBadge").innerText = user.first_name + " (" + user.id + ")";
    let bal = parseInt(localStorage.getItem("fz_bal_" + user.id) || "0");
    document.getElementById("bal").innerText = bal;
    function showMsg(text) {
      const box = document.getElementById("msgBox");
      box.style.display = "block";
      box.innerText = text;
    }
    function updateBal(add) {
      bal += add;
      localStorage.setItem("fz_bal_" + user.id, bal);
      document.getElementById("bal").innerText = bal;
    }
    function claimBonus() {
      const now = Date.now();
      const last = parseInt(localStorage.getItem("fz_last_" + user.id) || "0");
      if (now - last < 86400000) {
        showMsg("⏳ আপনি ইতিমধ্যে আজকের বোনাস নিয়েছেন! ২৪ ঘণ্টা পর আবার চেষ্টা করুন।");
        return;
      }
      localStorage.setItem("fz_last_" + user.id, now);
      updateBal(10);
      showMsg("🎉 সফল! আপনি +১০ পয়েন্ট Daily Bonus পেয়েছেন।");
    }
    function watchAd() {
      updateBal(5);
      showMsg("✅ বিজ্ঞাপন সম্পন্ন! +৫ পয়েন্ট যোগ হয়েছে।");
    }
    function showRef() {
      showMsg("👥 আপনার রেফার কোড: " + user.id + " — বন্ধুদের আমন্ত্রণ জানান!");
    }
    function openWithdraw() {
      if (bal < 300) {
        showMsg("❌ Withdraw করতে কমপক্ষে ৩০০ পয়েন্ট প্রয়োজন। আপনার আছে: " + bal + " পয়েন্ট।");
        return;
      }
      showMsg("💳 Withdraw অপশন চালু করতে বটের মেইন মেনু থেকে bKash/Nagad ব্যবহার করুন।");
    }
  </script>
</body>
</html>
